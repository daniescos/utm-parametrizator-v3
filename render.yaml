services:
  - type: web
    name: utm-generator
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: ADMIN_PASSWORD_HASH
        sync: false # set manually in Render dashboard — see README.md "Credentials & Admin Auth"
